services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ekt_assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d ekt_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
